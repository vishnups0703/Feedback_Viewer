<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feedback Launch</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{--bg:#f3f6fb;--card:#fff;--text:#18202e;--muted:#5f6b80;--line:#d6deeb;--accent:#3b82f6;--ok:#1f9d55;--err:#d03a3a}
@media (prefers-color-scheme:dark){:root{--bg:#2354b6;--card:#172033;--text:#e8eef9;--muted:#9aa8c2;--line:#2a3856}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
/* setup */
.setup{max-width:560px;margin:0 auto;padding:24px 18px}
.setup h1{margin:0 0 4px}.setup .sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
label{display:block;font-weight:600;margin:14px 0 4px}
.hint{font-weight:400;color:var(--muted);font-size:.82rem;display:block}
input[type=text],input[type=number]{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit}
.row{display:flex;gap:16px;align-items:center;margin-top:6px}.row label{margin:0;font-weight:500}
.btns{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
button.b{padding:12px 16px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font:inherit;font-weight:600;cursor:pointer}
button.p{background:var(--accent);border-color:var(--accent);color:#fff;flex:1}
#tst{margin-top:10px;font-size:.9rem;min-height:1.3em}
/* display */
.show{height:100vh;display:grid;grid-template-columns:1.2fr 1fr;gap:24px;padding:24px;background:linear-gradient(#0b1230,#1b2a5c);color:#eaf0ff;overflow:hidden}
@media (max-width:800px){.show{grid-template-columns:1fr;height:auto;min-height:100vh}}
.stage{position:relative;border-radius:22px;background:radial-gradient(2px 2px at 20% 15%,#fff,transparent),radial-gradient(2px 2px at 70% 25%,#fff,transparent),radial-gradient(1.5px 1.5px at 45% 40%,#fff,transparent),radial-gradient(2px 2px at 85% 60%,#fff,transparent),radial-gradient(1.5px 1.5px at 10% 70%,#fff,transparent),rgba(255,255,255,.04);overflow:hidden;min-height:340px}
.stage svg{position:absolute;inset:0;width:100%;height:100%}
#m{transition:transform 2.4s cubic-bezier(.5,0,1,.6)}
#m.bob{animation:bob 2.4s ease-in-out infinite}
#m.burn{animation:shake .08s linear infinite}
#m.fly{animation:none;transform:translateY(-130%)}
@keyframes bob{50%{transform:translateY(-5px)}}
@keyframes shake{0%{transform:translate(-2px,1px)}50%{transform:translate(2px,-1px)}100%{transform:translate(-1px,-2px)}}
#fl{transform-origin:55px 182px;transform-box:view-box;transition:transform .5s;animation:fk .18s ease-in-out infinite alternate}
@keyframes fk{to{opacity:.85}}
.side{display:flex;flex-direction:column;justify-content:center;gap:16px}
.side h1{font-size:clamp(1.4rem,3vw,2.2rem);margin:0}
.big{font-size:clamp(3.5rem,10vw,7rem);font-weight:800;line-height:1;color:#7fd1ff}
.bar{height:18px;background:rgba(255,255,255,.15);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffb347,#ff5e62);transition:width .8s}
.qr{background:#fff;padding:10px;border-radius:14px;line-height:0;align-self:flex-start}.qr svg{width:170px;height:170px}
#msg{position:absolute;left:0;right:0;top:38%;text-align:center;font-size:clamp(1.6rem,4vw,3rem);font-weight:800;opacity:0;transition:opacity 1s 2s}
#msg.on{opacity:1}
.warn{color:#ffb3b3;font-size:.85rem;min-height:1.2em}
</style>
</head>
<body>
<div id="app"></div>
<script>
var app=document.getElementById("app"), timer=null;
function $(s){return document.querySelector(s)}
function load(){try{return JSON.parse(localStorage.getItem("fbcfg")||"null")}catch(e){return null}}
function save(c){try{localStorage.setItem("fbcfg",JSON.stringify(c))}catch(e){}}
window.onhashchange=function(){location.reload()};

function csvUrl(u){
  u=(u||"").trim(); var m=u.match(/spreadsheets\/d\/([^\/?#]+)/); if(!m) return u;
  if(u.indexOf("/d/e/")>-1){var g=u.match(/gid=(\d+)/);return u.split("?")[0].replace(/\/pubhtml$/,"/pub")+"?output=csv"+(g?"&gid="+g[1]:"")}
  return "https://docs.google.com/spreadsheets/d/"+m[1]+"/gviz/tq?tqx=out:csv";
}
function countRows(t){
  var rows=0,q=false,cell="",has=false;
  function endCell(){if(cell.trim()!=="")has=true;cell=""}
  for(var i=0;i<t.length;i++){var ch=t[i];
    if(q){if(ch=='"'){if(t[i+1]=='"'){cell+='"';i++}else q=false}else cell+=ch}
    else if(ch=='"')q=true;
    else if(ch==',')endCell();
    else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;endCell();if(has)rows++;has=false}
    else cell+=ch}
  endCell(); if(has)rows++;
  return Math.max(rows-1,0); // minus header row
}
function jsonp(id,gid){
  return new Promise(function(res,rej){
    var s=document.createElement("script");
    var to=setTimeout(function(){s.remove();rej(new Error("no response. Share the sheet as 'Anyone with the link' (Viewer)."))},10000);
    window.google=window.google||{};google.visualization=google.visualization||{};
    google.visualization.Query={setResponse:function(r){
      clearTimeout(to);s.remove();
      if(r.status==="error")return rej(new Error((r.errors&&r.errors[0]&&r.errors[0].message)||"sheet error"));
      var n=(r.table.rows||[]).filter(function(row){return row.c.some(function(x){return x&&x.v!==null&&x.v!==""})}).length;
      res(n)}};
    s.onerror=function(){clearTimeout(to);rej(new Error("could not load the sheet"))};
    s.src="https://docs.google.com/spreadsheets/d/"+id+"/gviz/tq?headers=1&tqx=out:json"+(gid?"&gid="+gid:"")+"&_="+Date.now();
    document.head.appendChild(s);
  });
}
async function fetchCount(url){
  var u=(url||"").trim(),m=u.match(/spreadsheets\/d\/([^\/?#]+)/),pub=u.indexOf("/d/e/")>-1;
  if(!m) throw new Error("this is not a Google Sheet link");
  try{
    var r=await fetch(csvUrl(u),{cache:"no-store"});
    if(!r.ok) throw new Error("HTTP "+r.status);
    var t=await r.text();
    if(/^\s*<(!doctype|html)/i.test(t)) throw new Error("sheet is not public");
    return countRows(t);
  }catch(e){
    if(!pub){var g=u.match(/gid=(\d+)/);return jsonp(m[1],g&&g[1])}
    throw new Error("blocked. Paste the normal sheet link instead (shared as 'Anyone with the link').");
  }
}

/* ---------- SETUP (presenter only) ---------- */
function setup(){
  var c=load()||{total:10,mode:"num",head:"Scan and share your feedback",after:"On to the next step!"};
  app.innerHTML='<div class="setup"><h1>🚀 Feedback launch setup</h1><p class="sub">Only you see this page. The audience only sees the display.</p><div class="card">'
  +'<label>Feedback sheet link<span class="hint">Google Sheet with the form responses. Use File > Share > Publish to web (CSV), or share as "anyone with the link".</span></label><input type="text" id="sheet" placeholder="https://docs.google.com/spreadsheets/d/...">'
  +'<label>Feedback form link (shown as QR code)<span class="hint">The Google Form link your audience will fill.</span></label><input type="text" id="form" placeholder="https://forms.gle/...">'
  +'<label>Total participants<span class="hint">Launch happens when responses reach this number.</span></label><input type="number" id="total" min="1">'
  +'<label>Show progress as</label><div class="row"><label><input type="radio" name="mode" value="pct"> Percentage</label><label><input type="radio" name="mode" value="num"> Number (4 / 10)</label></div>'
  +'<label>Headline on screen</label><input type="text" id="head">'
  +'<label>Message after launch</label><input type="text" id="after">'
  +'<div class="row"><label><input type="checkbox" id="demo"> Demo mode (fake responses, for rehearsal)</label></div>'
  +'<div class="btns"><button class="b" id="tst">Test sheet</button><button class="b p" id="go">Launch display</button></div><div id="tstmsg" style="margin-top:10px;font-size:.9rem"></div></div></div>';
  $("#sheet").value=c.sheet||"";$("#form").value=c.form||"";$("#total").value=c.total;$("#head").value=c.head;$("#after").value=c.after;$("#demo").checked=!!c.demo;
  document.querySelector('input[name=mode][value='+c.mode+']').checked=true;
  function read(){return{sheet:$("#sheet").value.trim(),form:$("#form").value.trim(),total:Math.max(1,parseInt($("#total").value)||10),mode:document.querySelector('input[name=mode]:checked').value,head:$("#head").value||"Scan and share your feedback",after:$("#after").value||"On to the next step!",demo:$("#demo").checked}}
  $("#tst").onclick=async function(){var m=$("#tstmsg");m.style.color="";m.textContent="Checking...";
    try{var n=await fetchCount(read().sheet);m.style.color="var(--ok)";m.textContent="Connected. "+n+" response(s) found."}
    catch(e){m.style.color="var(--err)";m.textContent="Could not read the sheet: "+e.message}};
  $("#go").onclick=function(){var cfg=read();save(cfg);location.hash="#show="+btoa(unescape(encodeURIComponent(JSON.stringify(cfg))))};
}

/* ---------- DISPLAY (audience) ---------- */
function mascot(){
  return '<svg viewBox="0 0 200 240" preserveAspectRatio="xMidYMax meet"><rect x="20" y="212" width="160" height="10" rx="5" fill="#46527a"/>'
  +'<g id="m" class="bob">'
  +'<g id="fl"><path d="M45 180 Q55 235 65 180Z" fill="#ff7a29"/><path d="M50 180 Q55 218 60 180Z" fill="#ffe066"/></g>'
  +'<path d="M42 112 Q55 92 68 112V172H42Z" fill="#e85d5d"/><path d="M42 150 L30 175 L42 172Z M68 150 L80 175 L68 172Z" fill="#b83a3a"/><rect x="45" y="170" width="20" height="10" rx="2" fill="#555d73"/><circle cx="55" cy="132" r="6" fill="#bfe3ff"/>'
  +'<line x1="105" y1="92" x2="105" y2="76" stroke="#9bd0ff" stroke-width="3"/><circle cx="105" cy="73" r="5" fill="#ffd166"/>'
  +'<ellipse cx="100" cy="140" rx="45" ry="50" fill="#5ab0ff"/><ellipse cx="108" cy="152" rx="28" ry="30" fill="#8ccbff"/>'
  +'<circle cx="118" cy="126" r="12" fill="#fff"/><circle cx="121" cy="127" r="6" fill="#18202e"/><circle cx="94" cy="124" r="10" fill="#fff"/><circle cx="97" cy="125" r="5" fill="#18202e"/>'
  +'<path d="M100 152 Q112 162 124 150" stroke="#18202e" stroke-width="3" fill="none" stroke-linecap="round"/>'
  +'<ellipse cx="88" cy="193" rx="16" ry="8" fill="#3c8fd8"/><ellipse cx="120" cy="193" rx="16" ry="8" fill="#3c8fd8"/></g></svg>';
}
function show(c){
  var q="";try{var qq=qrcode(0,"M");qq.addData(c.form||"https://example.com");qq.make();q=qq.createSvgTag({cellSize:4,margin:0,scalable:true})}catch(e){}
  app.innerHTML='<div class="show"><div class="stage">'+mascot()+'<div id="msg"></div></div><div class="side"><h1>'+esc(c.head)+'</h1><div class="big" id="n"></div><div class="bar"><i id="bar"></i></div><div class="qr">'+q+'</div><div class="warn" id="warn"></div></div></div>';
  var count=0,launched=false;
  function paint(){
    var pct=Math.min(100,Math.round(count/c.total*100));
    $("#n").textContent=c.mode==="pct"?pct+"%":count+" / "+c.total;
    $("#bar").style.width=pct+"%";
    $("#fl").style.transform="scale("+(0.55+0.45*pct/100)+")";
    if(count>=c.total&&!launched){launched=true;launch()}
  }
  function launch(){
    var m=$("#m"),msg=$("#msg");msg.textContent=" "+c.after;
    $("#fl").style.transform="scale(1.9,2.2)";m.className="burn";
    setTimeout(function(){m.className="fly";$("#fl").style.transform="scale(2.4,3)";msg.className="on"},1800);
  }
  if(c.demo){var d=0;timer=setInterval(function(){if(d<c.total){d++;count=d;paint()}},1800)}
  else{
    var tick=async function(){try{count=await fetchCount(c.sheet);$("#warn").textContent="";paint()}catch(e){$("#warn").textContent="Cannot read sheet: "+e.message}};
    tick();timer=setInterval(tick,4000);
  }
  paint();
  document.onkeydown=function(e){if(e.key==="Escape"){location.hash="#setup"}};
}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

(function(){
  var h=location.hash;
  if(h.indexOf("#show=")===0){try{return show(JSON.parse(decodeURIComponent(escape(atob(h.slice(6))))))}catch(e){}}
  setup();
})();
</script>
</body>
</html>
