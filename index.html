<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feedback Launch</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{--bg:#f1efec;--card:#fbfaf8;--text:#2b2b29;--muted:#7b7a75;--line:#dedbd5;--accent:#3a3a37;--soft:#e8e5e0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
/* setup */
.top{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 48px;background:var(--card);border-bottom:1px solid var(--line)}
.brand{font-weight:700;letter-spacing:.02em}.brand span{color:var(--muted);font-weight:500;margin-left:10px;font-size:.9rem}
.tag{font-size:.8rem;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:4px 12px}
.page{min-width:1024px;max-width:1160px;margin:0 auto;padding:40px 48px 60px}
.page h1{font-size:1.9rem;font-weight:700;margin:0 0 6px;letter-spacing:-.01em}
.lead{color:var(--muted);margin:0 0 32px;max-width:640px;line-height:1.5}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:32px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:28px;margin-bottom:24px}
.card h2{font-size:1.05rem;margin:0 0 4px}.card .d{color:var(--muted);font-size:.88rem;margin:0 0 20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
label{display:block;font-weight:600;font-size:.88rem;margin:0 0 6px}
.field{margin-bottom:20px}.field:last-child{margin-bottom:0}
.hint{font-weight:400;color:var(--muted);font-size:.8rem;display:block;margin-top:5px;line-height:1.4}
input[type=text],input[type=number]{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text);font:inherit;font-size:.95rem}
input:focus{outline:2px solid var(--soft);border-color:#a5a29b}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg label{margin:0;font-weight:500;cursor:pointer}.seg input{display:none}
.seg span{display:block;padding:9px 18px;background:#fff;color:var(--muted);font-size:.9rem}
.seg input:checked+span{background:var(--accent);color:#fff}
.chk{display:flex;gap:10px;align-items:center;font-weight:500;margin:0}
.chk input{width:16px;height:16px;accent-color:var(--accent)}
button.b{padding:11px 18px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text);font:inherit;font-weight:600;font-size:.9rem;cursor:pointer}
button.b:hover{background:var(--soft)}
button.p{background:var(--accent);border-color:var(--accent);color:#fff;width:100%;padding:14px;font-size:1rem}
button.p:hover{background:#242422}
.aside{position:sticky;top:24px}
.steps{margin:0;padding-left:20px;color:var(--muted);font-size:.88rem;line-height:1.7}.steps b{color:var(--text)}
.sep{height:1px;background:var(--line);margin:20px 0}
.small{font-size:.8rem;color:var(--muted);line-height:1.5;margin:14px 0 0}
.testrow{display:flex;align-items:center;gap:14px;margin-top:20px}
#tstmsg{font-size:.88rem;color:var(--text)}

/* display */
.show{height:100vh;display:grid;grid-template-columns:1.2fr 1fr;gap:24px;padding:24px;background:linear-gradient(#0b1230,#1b2a5c);color:#eaf0ff;overflow:hidden; position:relative;}
@media (max-width:800px){.show{grid-template-columns:1fr;height:auto;min-height:100vh}}
.stage{position:relative;border-radius:22px;background:radial-gradient(2px 2px at 20% 15%,#fff,transparent),radial-gradient(2px 2px at 70% 25%,#fff,transparent),radial-gradient(1.5px 1.5px at 45% 40%,#fff,transparent),radial-gradient(2px 2px at 85% 60%,#fff,transparent),radial-gradient(1.5px 1.5px at 10% 70%,#fff,transparent),rgba(255,255,255,.04);overflow:hidden;min-height:340px}

/* Enhanced Animations */
#m{transition:transform 2.4s cubic-bezier(.5,0,1,.6)}
#m.bob{animation:bob 2.4s ease-in-out infinite}
#m.tense{animation:vibrate 0.15s linear infinite}
#m.critical{animation:shake 0.05s linear infinite; filter:drop-shadow(0 0 25px rgba(255, 60, 60, 0.8))}
#m.shoot{transition:transform 0.4s cubic-bezier(.5,0,.8,1); transform:translateY(-300%)}

@keyframes bob{50%{transform:translateY(-5px)}}
@keyframes vibrate{0%,100%{transform:translate(0,0)}25%{transform:translate(-1px,1px)}50%{transform:translate(1px,-1px)}75%{transform:translate(-1px,-1px)}}
@keyframes shake{0%{transform:translate(-2px,1px)}50%{transform:translate(2px,-1px)}100%{transform:translate(-1px,-2px)}}

#fl{transform-origin:55px 182px;transform-box:view-box;transition:transform .5s;animation:fk .18s ease-in-out infinite alternate}
@keyframes fk{to{opacity:.85}}

/* Flame Colors */
.fl-tense path:nth-child(1){fill:#ff4000 !important;} /* Intense Orange */
.fl-critical path:nth-child(1){fill:#00e1ff !important;} /* Intense Blue */
.fl-critical path:nth-child(2){fill:#ffffff !important;} /* White Core */

/* Warning Glow */
.warning-glow{position:absolute; inset:0; background:radial-gradient(circle at 35% 60%, rgba(255,40,40,0.5) 0%, transparent 60%); opacity:0; transition:opacity 0.5s; z-index:0;}
.warning-glow.active{opacity:1; animation:pulseGlow 0.8s infinite alternate;}
@keyframes pulseGlow{from{opacity:0.4}to{opacity:0.9}}

.side{display:flex;flex-direction:column;justify-content:center;gap:16px; transition:opacity 0.5s;}
.side h1{font-size:clamp(1.4rem,3vw,2.2rem);margin:0}
.big{font-size:clamp(3.5rem,10vw,7rem);font-weight:800;line-height:1;color:#7fd1ff; display:inline-block;}

/* Number Micro-Interaction Pop */
.big.pop{animation:popAnim 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);}
@keyframes popAnim{50%{transform:scale(1.25); color:#fff; text-shadow:0 0 20px rgba(255,255,255,0.6);}}

.bar{height:18px;background:rgba(255,255,255,.15);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffb347,#ff5e62);transition:width .8s}
.qr{background:#fff;padding:10px;border-radius:14px;line-height:0;align-self:flex-start}.qr svg{width:170px;height:170px}

/* Full Screen Flash */
.flash{position:fixed; inset:0; background:white; z-index:9999; opacity:0; pointer-events:none;}
.flash.active{animation:flashScreen 1s ease-out;}
@keyframes flashScreen{0%{opacity:1}100%{opacity:0}}

.fade-out{opacity:0 !important; pointer-events:none; transition:opacity 0.5s ease-out;}

#msg{position:absolute; left:0; right:0; top:40%; text-align:center; font-size:clamp(1.8rem,5vw,4rem); font-weight:800; opacity:0; transform:scale(0.3); transition:all 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index:10; text-shadow:0 10px 30px rgba(0,0,0,0.8);}
#msg.on{opacity:1; transform:scale(1);}
.warn{color:#ffb3b3;font-size:.85rem;min-height:1.2em}
</style>
</head>
<body>
<div id="app"></div>
<script>
var app=document.getElementById("app"), timer=null;
function $(s){return document.querySelector(s)}
function load(){try{return JSON.parse(localStorage.getItem("fbcfg")||"null")}catch(e){return null}}
function save(c){try{localStorage.setItem("fbcfg",JSON.stringify(c))}catch(e){}}
window.onhashchange=function(){route()};

function csvUrl(u){
  u=(u||"").trim(); var m=u.match(/spreadsheets\/d\/([^\/?#]+)/); if(!m) return u;
  if(u.indexOf("/d/e/")>-1){var g=u.match(/gid=(\d+)/);return u.split("?")[0].replace(/\/pubhtml$/,"/pub")+"?output=csv"+(g?"&gid="+g[1]:"")}
  return "https://docs.google.com/spreadsheets/d/"+m[1]+"/gviz/tq?tqx=out:csv";
}
function countRows(t){
  var rows=0,q=false,cell="",has=false;
  function endCell(){if(cell.trim()!=="")has=true;cell=""}
  for(var i=0;i<t.length;i++){var ch=t[i];
    if(q){if(ch=='"'){if(t[i+1]=='"'){cell+='"';i++}else q=false}else cell+=ch}
    else if(ch=='"')q=true;
    else if(ch==',')endCell();
    else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;endCell();if(has)rows++;has=false}
    else cell+=ch}
  endCell(); if(has)rows++;
  return Math.max(rows-1,0); 
}
function jsonp(id,gid){
  return new Promise(function(res,rej){
    var s=document.createElement("script");
    var to=setTimeout(function(){s.remove();rej(new Error("no response"))},10000);
    window.google=window.google||{};google.visualization=google.visualization||{};
    google.visualization.Query={setResponse:function(r){
      clearTimeout(to);s.remove();
      if(r.status==="error")return rej(new Error("sheet error"));
      var n=(r.table.rows||[]).filter(function(row){return row.c.some(function(x){return x&&x.v!==null&&x.v!==""})}).length;
      res(n)}};
    s.onerror=function(){clearTimeout(to);rej(new Error("error"))};
    s.src="https://docs.google.com/spreadsheets/d/"+id+"/gviz/tq?headers=1&tqx=out:json"+(gid?"&gid="+gid:"")+"&_="+Date.now();
    document.head.appendChild(s);
  });
}
async function fetchCount(url){
  var u=(url||"").trim(),m=u.match(/spreadsheets\/d\/([^\/?#]+)/),pub=u.indexOf("/d/e/")>-1;
  if(!m) throw new Error("not a sheet link");
  try{
    var r=await fetch(csvUrl(u),{cache:"no-store"});
    if(!r.ok) throw new Error("HTTP "+r.status);
    var t=await r.text();
    if(/^\s*<(!doctype|html)/i.test(t)) throw new Error("not public");
    return countRows(t);
  }catch(e){
    if(!pub){var g=u.match(/gid=(\d+)/);return jsonp(m[1],g&&g[1])}
    throw new Error("blocked");
  }
}

/* ---------- SETUP ---------- */
function setup(){
  if(document.fullscreenElement)document.exitFullscreen();
  var c=load()||{total:10,mode:"num",head:"Scan and share your feedback",after:"Launch Successful!"};
  app.innerHTML='<div class="top"><div class="brand">Feedback Launch<span>Setup</span></div><div class="tag">Presenter only</div></div>'
  +'<div class="page"><h1>Set up your feedback session</h1><p class="lead">Connect your response sheet, set how many people you expect, and launch the display. Your audience only ever sees the final screen.</p><div class="cols"><div>'
  +'<div class="card"><h2>Data source</h2><p class="d">Where responses are collected and where people scan to answer.</p>'
  +'<div class="field"><label>Feedback sheet link</label><input type="text" id="sheet" placeholder="https://docs.google.com/spreadsheets/d/..."><span class="hint">The Google Sheet linked to your form. Share it as "Anyone with the link" (Viewer).</span></div>'
  +'<div class="field"><label>Feedback form link</label><input type="text" id="form" placeholder="https://forms.gle/..."><span class="hint">Turned into the QR code shown on the display.</span></div>'
  +'<div class="testrow"><button class="b" id="tst">Test sheet connection</button><span id="tstmsg"></span></div></div>'
  +'<div class="card"><h2>Session details</h2><p class="d">Control the goal and what the audience reads.</p>'
  +'<div class="grid2"><div class="field"><label>Total participants</label><input type="number" id="total" min="1"><span class="hint">The rocket launches when responses reach this number.</span></div>'
  +'<div class="field"><label>Show progress as</label><div class="seg"><label><input type="radio" name="mode" value="pct"><span>Percentage</span></label><label><input type="radio" name="mode" value="num"><span>Number</span></label></div><span class="hint">Percentage shows 40%. Number shows 4 / 10.</span></div></div>'
  +'<div class="field"><label>Headline on screen</label><input type="text" id="head"></div>'
  +'<div class="field"><label>Message after launch</label><input type="text" id="after"></div></div>'
  +'</div><div class="aside"><div class="card"><h2>Ready to present?</h2><p class="d">Review the details, then open the display.</p>'
  +'<button class="b p" id="go">Launch display</button><label class="chk" style="margin-top:16px"><input type="checkbox" id="full" checked> Open in full screen</label><div class="sep"></div>'
  +'<label class="chk"><input type="checkbox" id="demo"> Demo mode</label><p class="small">Adds a fake response every two seconds so you can rehearse the launch without a form.</p></div>'
  +'<div class="card"><h2>How it works</h2><ol class="steps"><li><b>Connect</b> your sheet and form.</li><li><b>Set</b> the number of participants.</li><li><b>Launch</b> and show the QR code.</li><li><b>Watch</b> the mascot take off.</li></ol><p class="small">Press Esc on the display to return here.</p></div></div></div></div>';
  $("#sheet").value=c.sheet||"";$("#form").value=c.form||"";$("#total").value=c.total;$("#head").value=c.head;$("#after").value=c.after;$("#demo").checked=!!c.demo;$("#full").checked=c.full!==false;
  document.querySelector('input[name=mode][value='+c.mode+']').checked=true;
  function read(){return{sheet:$("#sheet").value.trim(),form:$("#form").value.trim(),total:Math.max(1,parseInt($("#total").value)||10),mode:document.querySelector('input[name=mode]:checked').value,head:$("#head").value||"Scan and share your feedback",after:$("#after").value||"Launch Successful!",demo:$("#demo").checked,full:$("#full").checked}}
  $("#tst").onclick=async function(){var m=$("#tstmsg");m.textContent="Checking...";
    try{var n=await fetchCount(read().sheet);m.textContent="✓ Connected. "+n+" response(s) found."}
    catch(e){m.textContent="✕ Could not read the sheet: "+e.message}};
  $("#go").onclick=function(){var cfg=read();save(cfg);if(cfg.full&&document.documentElement.requestFullscreen){document.documentElement.requestFullscreen().catch(function(){})}location.hash="#show="+btoa(unescape(encodeURIComponent(JSON.stringify(cfg))))};
}

/* ---------- DISPLAY (audience) ---------- */
function mascot(){
  return '<svg viewBox="0 0 200 240" preserveAspectRatio="xMidYMax meet" style="position:absolute; inset:0; width:100%; height:100%; z-index:1;"><rect x="20" y="212" width="160" height="10" rx="5" fill="#46527a"/>'
  +'<g id="m" class="bob">'
  +'<g id="fl"><path d="M45 180 Q55 235 65 180Z" fill="#ff7a29"/><path d="M50 180 Q55 218 60 180Z" fill="#ffe066"/></g>'
  +'<path d="M42 112 Q55 92 68 112V172H42Z" fill="#e85d5d"/><path d="M42 150 L30 175 L42 172Z M68 150 L80 175 L68 172Z" fill="#b83a3a"/><rect x="45" y="170" width="20" height="10" rx="2" fill="#555d73"/><circle cx="55" cy="132" r="6" fill="#bfe3ff"/>'
  +'<line x1="105" y1="92" x2="105" y2="76" stroke="#9bd0ff" stroke-width="3"/><circle cx="105" cy="73" r="5" fill="#ffd166"/>'
  +'<ellipse cx="100" cy="140" rx="45" ry="50" fill="#5ab0ff"/><ellipse cx="108" cy="152" rx="28" ry="30" fill="#8ccbff"/>'
  +'<circle cx="118" cy="126" r="12" fill="#fff"/><circle cx="121" cy="127" r="6" fill="#18202e"/><circle cx="94" cy="124" r="10" fill="#fff"/><circle cx="97" cy="125" r="5" fill="#18202e"/>'
  +'<path d="M100 152 Q112 162 124 150" stroke="#18202e" stroke-width="3" fill="none" stroke-linecap="round"/>'
  +'<ellipse cx="88" cy="193" rx="16" ry="8" fill="#3c8fd8"/><ellipse cx="120" cy="193" rx="16" ry="8" fill="#3c8fd8"/></g></svg>';
}

function show(c){
  var q="";try{var qq=qrcode(0,"M");qq.addData(c.form||"https://example.com");qq.make();q=qq.createSvgTag({cellSize:4,margin:0,scalable:true})}catch(e){}
  
  app.innerHTML='<div class="flash" id="flash"></div><div class="show"><div class="stage"><div class="warning-glow" id="glow"></div>'+mascot()+'<div id="msg"></div></div><div class="side" id="side"><h1 id="hd">'+esc(c.head)+'</h1><div><div class="big" id="n"></div></div><div class="bar" id="bwrap"><i id="bar"></i></div><div class="qr" id="qwrap">'+q+'</div><div class="warn" id="warn"></div></div></div>';
  
  var count=0, launched=false, prevCount=-1;
  
  function paint(){
    var pct=Math.min(100,Math.round(count/c.total*100));
    var nEl = $("#n");
    nEl.textContent=c.mode==="pct"?pct+"%":count+" / "+c.total;
    $("#bar").style.width=pct+"%";
    
    // 1. Micro-interaction: Scale/pop number on increment
    if (count > prevCount && prevCount !== -1 && !launched) {
      nEl.classList.remove("pop");
      void nEl.offsetWidth; // trigger reflow
      nEl.classList.add("pop");
    }
    prevCount = count;

    if(!launched) {
      var m = $("#m");
      var fl = $("#fl");
      var glow = $("#glow");
      
      // 2. Escalating Tension based on percentage
      if (pct < 50) {
        m.className = "bob";
        fl.className = "";
        glow.classList.remove("active");
        fl.style.transform = "scale(" + (0.55 + 0.2 * (pct/50)) + ")"; // Subtle growth
      } 
      else if (pct < 90) {
        m.className = "tense";
        fl.className = "fl-tense";
        glow.classList.remove("active");
        fl.style.transform = "scale(" + (0.8 + 0.4 * ((pct-50)/40)) + ")"; // Larger, orange flame
      } 
      else if (pct < 100) {
        m.className = "critical";
        fl.className = "fl-critical";
        glow.classList.add("active"); // Red pulsing background
        fl.style.transform = "scale(1.5)"; // Intense thrust
      }
    }

    if(count>=c.total&&!launched){launched=true;launch()}
  }

  function launch(){
    var m=$("#m"), msg=$("#msg"), fl=$("#fl"), side=$("#side");
    msg.textContent="🚀 "+c.after;
    
    // 3. Climactic Payoff
    // Fade out everything on the right side
    side.classList.add("fade-out");
    $("#glow").classList.remove("active");
    
    // Trigger full screen flash
    $("#flash").classList.add("active");
    
    // Shoot mascot up super fast
    fl.className = "fl-critical";
    fl.style.transform = "scale(2.5, 3.5)";
    m.className = "shoot";
    
    // Bring in final success message dramatically
    setTimeout(function(){
      msg.className="on";
    }, 600);
  }
  
  if(c.demo){var d=0;timer=setInterval(function(){if(d<c.total){d++;count=d;paint()}},1800)}
  else{
    var tick=async function(){try{count=await fetchCount(c.sheet);$("#warn").textContent="";paint()}catch(e){$("#warn").textContent="Cannot read sheet: "+e.message}};
    tick();timer=setInterval(tick,4000);
  }
  paint();
  
  document.onkeydown=function(e){var k=e.key.toLowerCase();if(k==="f"){if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen().catch(function(){})}else if(k==="escape"||k==="s"){location.hash="#setup"}};
}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

function route(){
  clearInterval(timer);document.onkeydown=null;
  var h=location.hash;
  if(h.indexOf("#show=")===0){
    var c=load();
    if(!c){try{c=JSON.parse(decodeURIComponent(escape(atob(h.slice(6)))))}catch(e){}}
    if(c)return show(c);
  }
  setup();
}
route();
</script>
</body>
</html>
